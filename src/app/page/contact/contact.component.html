<div>
    <app-navbar></app-navbar>
</div>

<div>

    <section class="pt-32 pb-20 px-6">
        <div class="max-w-4xl mx-auto text-center mb-12">
            <h1 class="text-4xl font-extrabold text-[#3C6E71] mb-4">Get in Touch</h1>
            <p class="text-gray-500">Have a project in mind or want to discuss a potential opportunity?</p>
        </div>

        <div class="max-w-2xl mx-auto bg-white p-8 md:p-12 rounded-3xl border border-gray-100 shadow-xl">
            <form action="#" method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Name</label>
                        <input type="text" placeholder="John Doe"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-[#2EC4B6] focus:ring-2 focus:ring-[#2EC4B6]/20 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                        <input type="email" placeholder="john@example.com"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-[#2EC4B6] focus:ring-2 focus:ring-[#2EC4B6]/20 outline-none transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Subject</label>
                    <input type="text" placeholder="How can I help you?"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-[#2EC4B6] focus:ring-2 focus:ring-[#2EC4B6]/20 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Message</label>
                    <textarea rows="4" placeholder="Your message here..."
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-[#2EC4B6] focus:ring-2 focus:ring-[#2EC4B6]/20 outline-none transition-all"></textarea>
                </div>
                <button type="submit"
                    class="w-full py-4 bg-[#2EC4B6] text-white font-bold rounded-xl shadow-lg hover:bg-[#3C6E71] transition-all transform hover:-translate-y-1">Send
                    Message</button>
            </form>
        </div>

        <div class="max-w-6xl mx-auto mt-20 text-center">
            <h3 class="text-xl font-bold text-[#3C6E71] mb-8">Connect Digitally</h3>
            <div class="flex justify-center gap-6">
                <a href="https://linkedin.com"
                    class="flex items-center gap-3 px-8 py-3 rounded-full border border-gray-200 text-gray-600 hover:bg-[#2EC4B6] hover:text-white hover:border-[#2EC4B6] transition-all group">
                    <i class="fab fa-linkedin text-xl"></i>
                    <span class="font-semibold">LinkedIn</span>
                </a>
                <a href="https://github.com"
                    class="flex items-center gap-3 px-8 py-3 rounded-full border border-gray-200 text-gray-600 hover:bg-[#3C6E71] hover:text-white hover:border-[#3C6E71] transition-all group">
                    <i class="fab fa-github text-xl"></i>
                    <span class="font-semibold">GitHub</span>
                </a>
            </div>
        </div>
    </section>
</div>

<div>
    <app-footer></app-footer>
